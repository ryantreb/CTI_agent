name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv pip install --system pytest

      - name: Run tests
        run: uv run pytest -q

  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          for f in config/*.json; do
            echo "Validating $f..."
            python3 -m json.tool "$f" > /dev/null
          done

  mcp-config-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv pip install --system pytest

      - name: Check mcp_config.json is in sync with registry
        run: |
          uv run python scripts/generate_mcp_config.py
          if ! git diff --exit-code config/mcp_config.json; then
            echo "FAIL: config/mcp_config.json is out of sync with the registry."
            echo "Run: uv run python scripts/generate_mcp_config.py"
            exit 1
          fi
